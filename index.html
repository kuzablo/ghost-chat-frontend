<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mascot.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <!-- [2.35.9] Critical CSS — до основного бандла. Гасит FOUC на первом рендере. -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #F5A9C0;
        color: #111111;
        font-family: 'Segoe UI', 'Comic Sans MS', sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body.dark {
        background: #0E1726;
        color: #EAF2FA;
      }
      #root {
        height: 100%;
        width: 100%;
        visibility: hidden;
      }
      #root.ready {
        visibility: visible;
      }
      /* Страховка: если что-то пойдёт не так, через 4с показываем что есть. */
      .no-js-fallback #root {
        visibility: visible;
      }
    </style>

    <meta name="theme-color" content="#F5A9C0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-title" content="crew" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC&family=Caveat&family=Cormorant+Garamond:wght@400;700&family=Marck+Script&family=Neucha&family=Pacifico&family=Unbounded:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>banjoboy's crew</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- [2.35.9] Тема ставится ДО модуля — иначе мигание розовым при тёмной теме. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('ghost-chat-theme') === 'dark') {
            document.body.classList.add('dark');
          }
        } catch (e) { /* noop */ }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <!-- [2.35.9] Аварийная страховка: если React не смонтируется за 4с — показываем root. -->
    <script>
      (function () {
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.classList.contains('ready')) {
            r.classList.add('ready');
          }
        }, 4000);
      })();
    </script>
  </body>
</html>
