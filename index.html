<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mascot.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <!-- [2.35.35] Critical CSS + boot-splash, который удаляется после готовности -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #F5A9C0;
        color: #111111;
        font-family: 'Segoe UI', 'Comic Sans MS', sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body.dark {
        background: #0E1726;
        color: #EAF2FA;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F5A9C0;
        z-index: 99999;
        transition: opacity 0.32s ease-out;
        pointer-events: none;
      }
      body.dark #boot-splash {
        background: #0E1726;
      }
      #boot-splash__inner {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid #111;
        background: #FFF url('/mascot.png') center / cover no-repeat;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        animation: bootPulse 1.2s ease-in-out infinite;
      }
      body.dark #boot-splash__inner {
        border-color: #3BB5E8;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50%      { transform: scale(1.05); opacity: 1; }
      }
      body.app-ready #boot-splash {
        opacity: 0;
      }

      #root {
        height: 100%;
        width: 100%;
      }
    </style>

    <meta name="theme-color" content="#F5A9C0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-title" content="crew" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://api.banjoboy420.ru" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC&family=Caveat&family=Cormorant+Garamond:wght@400;700&family=Marck+Script&family=Neucha&family=Pacifico&family=Unbounded:wght@400;700&display=block"
      rel="stylesheet"
    />

    <title>banjoboy's crew</title>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div id="boot-splash__inner"></div>
    </div>

    <div id="root"></div>

    <script>
      (function () {
        try {
          if (localStorage.getItem('ghost-chat-theme') === 'dark') {
            document.body.classList.add('dark');
          }
        } catch (e) { /* noop */ }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <!-- [2.35.35] Аварийная страховка: снимаем splash за 8с, если React не смог -->
    <script>
      (function () {
        setTimeout(function () {
          var el = document.getElementById('boot-splash');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 8000);
      })();
    </script>
  </body>
</html>
